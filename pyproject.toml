[project]
name = "olx-ml-platform"
version = "0.1.0"
description = "Local ML model lifecycle management for the OLX MLOps case"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docker>=7.1,<8",
    "fastapi>=0.115,<1",
    "joblib>=1.4,<2",
    "typer>=0.15,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
mlplatform = "olx_ml_platform:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.uv.build-backend]
module-name = ["olx_ml_platform", "domain", "application", "infrastructure", "cli", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
